apiVersion: v1
kind: ServiceAccount
metadata:
  name: gokubegate-tester
  namespace: gokubegate-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gokubegate-endpointslice-reader
  namespace: gokubegate-e2e
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gokubegate-tester-binding
  namespace: gokubegate-e2e
subjects:
  - kind: ServiceAccount
    name: gokubegate-tester
    namespace: gokubegate-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gokubegate-endpointslice-reader
